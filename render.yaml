services:
  - type: web
    name: bagre-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: RAPIDAPI_KEY
        sync: false
      - key: DATABASE_PATH
        value: /tmp/bagre.db
      - key: ENVIRONMENT
        value: production
